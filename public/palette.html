<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>arcify — Search or jump</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="palette" data-page="palette">
    <div class="palette-search">
      <input
        id="query"
        role="combobox"
        aria-label="Search tabs, bookmarks, downloads and commands"
        aria-controls="results"
        aria-expanded="true"
        aria-autocomplete="list"
        autocomplete="off"
        placeholder="Search or jump…"
        autofocus
      />
      <kbd>esc</kbd>
    </div>
    <div
      id="results"
      class="results"
      role="listbox"
      aria-label="Local results"
    ></div>
    <div class="palette-footer">
      <span>↑ ↓ Navigate</span><span id="enter-hint">↵ Open</span
      ><span id="fresh-hint">⌘ ↵ New tab</span>
    </div>
    <script type="module" src="palette.js"></script>
  </body>
</html>
